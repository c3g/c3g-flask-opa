name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Needed by tests/test_integration_opa_server.py, which fails (not skips) in CI without it.
      # Keep in step with the OPA version the sidecars run.
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.21.3
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -v
